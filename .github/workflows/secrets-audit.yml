# Daily secrets scan of EVERY branch and tag (personal-cfo-md8h2.22).
#
# The required `Security scanning` check in ci.yml scans only the change under test, because a
# scan that reads every fetched branch let one flagged commit on any pushed branch fail every
# pull request, queue run and push to main. This workflow keeps the other half: every day it
# scans all refs (a secret pushed to any branch is still caught), and on a finding it opens or
# updates ONE issue labeled `secret-scan` (scripts/audit-alert.sh, the same alert path as the
# dependency audit), so it informs without blocking anyone. It is not a required check. The
# report is gitleaks' redacted JSON reduced to rule, file, line and short commit: no secret
# value, and no author name or e-mail address, reaches the issue.
#
# A finding is either a real credential (rotate it first, then remove it) or a false positive
# (add a narrow allowlist entry to .gitleaks.toml in the branch that carries it).
name: Daily secrets audit

on:
  schedule:
    - cron: '41 5 * * *' # 05:41 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-audit
  cancel-in-progress: false

jobs:
  audit-all-refs:
    name: Scan every branch for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # A schedule payload carries no repository object, so the visibility is read from the
      # API (the same reason as ci.yml's security-scan job).
      - name: Resolve visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          is_private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$is_private" = "false" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Repository is private; skipping the scheduled secrets audit."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.visibility.outputs.run == 'true'
        with:
          fetch-depth: 0 # every branch and tag, full history
          persist-credentials: false

      - name: Install gitleaks
        if: steps.visibility.outputs.run == 'true'
        run: bash scripts/install-gitleaks.sh

      - name: Scan all refs
        id: scan
        if: steps.visibility.outputs.run == 'true'
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gitleaks.json"
          summary="$RUNNER_TEMP/secrets-summary.txt"
          status=clean
          bash scripts/gitleaks-scan.sh --all-refs --report "$report" || status=failed
          if [ "$status" = failed ]; then
            if [ -s "$report" ]; then
              jq -r '[.[] | "\(.RuleID)  \(.File):\(.StartLine)  commit \(.Commit[0:12])"] | unique | .[0:50] | .[]' "$report" > "$summary" || true
              total="$(jq 'length' "$report" 2>/dev/null || echo "?")"
              echo "(${total} finding(s) in all; at most 50 distinct lines are listed; the secret values are not shown.)" >> "$summary"
            else
              echo "gitleaks failed without writing a report; see the run log." > "$summary"
            fi
          else
            echo "clean" > "$summary"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: File or update the secret-scan issue
        if: steps.visibility.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.scan.outputs.status }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/audit-alert.sh --status "$STATUS" --report "$SUMMARY" --run-url "$RUN_URL" \
            --label secret-scan --title "Secrets scan finding on a branch of the repository" \
            --intro "The daily secrets scan of every branch and tag found something. Rotate anything real before removing it; for a false positive add a narrow allowlist entry to .gitleaks.toml on the branch that carries it."

      - name: Fail the run if the scan found something
        if: steps.visibility.outputs.run == 'true' && steps.scan.outputs.status == 'failed'
        run: |
          echo "::error::the daily secrets scan found something; see the secret-scan issue."
          exit 1

name: CI

# Public-repo triggers, shipped now but inert until the repo is public
# (personal-cfo-fkt5.7, owner decision G option 2). This file lands inside
# the go-live snapshot (docs/operations/public-launch-snapshot.md), so it
# must already be correct on day one — the alternative (adding triggers only
# after the flip) would mean the very first public PR is untested. Two
# independent guards keep it free while this repo is still private:
#
#   1. VISIBILITY GUARD (every job): `if: github.event_name ==
#      'workflow_dispatch' || github.event.repository.private == false`.
#      While private, only a manual dispatch runs anything — push/pull_request
#      events are no-ops (the job still gets a run, but every step is
#      skipped, which GitHub reports as Success, not "Expected — waiting").
#      Once public, the guard is always true and every job runs normally.
#      `schedule` events are a DELIBERATE EXCEPTION to this guard, not an
#      oversight — see security-scan's own comment for why `github.event.
#      repository` doesn't exist on a schedule trigger, which makes this
#      exact boolean form silently always-true for it, and how that job
#      re-checks visibility for real instead.
#   2. IN-JOB PATH FILTERING (rust/frontend/ipc-codegen only, not a
#      workflow-level `paths-ignore`): a `dorny/paths-filter` step is each of
#      those jobs' own first real step; their expensive compile/test steps run
#      only `if: steps.filter.outputs.code == 'true' || github.event_name !=
#      'pull_request'` (so a manual dispatch, a push to main and a merge-queue
#      run always exercise every step; only a pull request is filtered, see 3
#      below). A workflow-level `paths-ignore` on the
#      trigger would make the whole workflow run NOT EXIST for a docs-only
#      push — and personal-cfo-fkt5.9 makes these job names required checks,
#      which would then sit at "Expected — waiting for status" forever. A job
#      that runs but skips its expensive steps reports real Success instead.
#      security-scan and Shell scripts run unconditionally (visibility guard
#      only) — they're either already fast (Shell scripts) or need to run on
#      every change regardless of which files changed (security-scan).
#
#   3. FULL GATES OFF PULL REQUESTS (personal-cfo-md8h2.11): the in-job path
#      filter above applies to `pull_request` events ONLY. Every `push` to main
#      (never cancelled, see `concurrency`) and every `merge_group` (merge queue)
#      run executes each job's full gates, so a docs-only or non-Rust commit
#      can never report a skipped-steps "success" that hides a red main. A
#      failed push to main opens or updates a `ci-main-red` issue
#      (`main-red-alert`, last job).
#
# Manual dispatch still works exactly as before, for a pre-flip hosted check:
#   - the Actions tab → "CI" → "Run workflow", or
#   - gh workflow run ci.yml --ref <branch>
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue (personal-cfo-md8h2.11): GitHub builds a temporary merge of
  # the queued PR onto main and waits for the required checks on THAT commit.
  # Every required job below runs its full gates on this event.
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly, security-scan only — every other job explicitly excludes
    # `schedule` events (see each job's `if:`), so this cron doesn't burn
    # minutes re-running the compile/test jobs with nothing new to check.
    - cron: '0 6 * * 1' # Monday 06:00 UTC

# Cancel superseded runs on the same pull request branch, but NEVER on main
# (personal-cfo-md8h2.11). Cancelling main's runs hid a semantic break between
# two PRs that each passed alone. A run on main gets a group of its own (its
# commit SHA), so no push to main is ever cancelled or replaced in a "pending"
# slot by a later one; every commit on main gets a complete verdict.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # dorny/paths-filter needs this to list changed files via the GitHub API
  # on pull_request events (it uses git diff instead for push events, which
  # needs no extra permission — but PRs are the common case here).
  pull-requests: read

jobs:
  rust:
    name: Rust (workspace)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # dorny/paths-filter needs at least the previous commit reachable
          # for a push event's "diff against the prior commit on this branch"
          # comparison; the default shallow depth of 1 has only HEAD.
          fetch-depth: 2

      # In-job path filtering (personal-cfo-fkt5.7) — see the workflow-level
      # comment at the top of this file for why this is a step-level filter
      # and not a workflow-level `paths-ignore`.
      - name: Detect changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'

      # The pinned toolchain (channel + rustfmt/clippy) comes from
      # rust-toolchain.toml, which rustup honors automatically.
      - name: Show toolchain
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'

      # During the bootstrap phase the root workspace has zero member crates,
      # and cargo cannot build/test/clippy/fmt a virtual manifest with no
      # members. So we validate the manifest with `cargo metadata` until the
      # first crate lands (core-money, personal-cfo-klr.1), at which point the
      # full gates activate automatically — no workflow edit required.
      - name: Rust gates (auto-activate with first crate)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          members=$(cargo metadata --format-version 1 --no-deps | jq '.packages | length')
          echo "Workspace member crates: $members"
          if [ "$members" -eq 0 ]; then
            echo "Bootstrap phase: no member crates yet — validating manifest only."
            cargo metadata --format-version 1 --no-deps > /dev/null
          else
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          fi

      # Declared MSRV (ADR 0001 addendum 2026-09-28, personal-cfo-g3m.5): the
      # workspace's `rust-version` must actually build with THAT compiler, not
      # just with the pinned 1.99 above. A 1.99 pass proves nothing about the
      # floor, so this checks the complete locked graph with the floor itself.
      - name: Declared MSRV builds (root workspace)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          msrv=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '[.packages[].rust_version] | unique | join(" ")')
          case "$msrv" in
            ""|*" "*) echo "::error::workspace members must share one rust-version, got: '$msrv'"; exit 1 ;;
          esac
          echo "Declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --workspace --all-targets

      # Monetary amounts must use integer minor units, never floating point
      # (plan §9.1). Forbid f32/f64 in money-critical crates' non-test source.
      #
      # personal-cfo-fkt5.7: this step has never actually run before now —
      # like security-scan's gitleaks step above, it only ever existed on a
      # workflow_dispatch-only trigger that (per this branch's own dispatch
      # history) was never manually fired after it was added — and it found
      # two real, pre-existing gaps in the check itself on its first run,
      # neither of which is an actual money-as-float bug:
      #
      #   1. A bare `grep` can't tell code from comments, so a doc comment
      #      literally ASSERTING "no f64" (crates/forecast-engine/src/
      #      payoff.rs:3, revolving.rs:4: "Pure + deterministic... integer-
      #      cent math, no `f64` / clock / IO.") tripped the same rule it was
      #      describing compliance with. Fixed the same way the "Enforce
      #      importer isolation boundaries" step below already does it:
      #      strip `//`-comments with sed before grepping.
      #   2. crates/forecast-engine/src/layer2.rs (ADR 0026 §7's statistical
      #      spend-band model) genuinely uses f64 — verified by reading the
      #      actual code (same discipline as this repo's other narrow,
      #      documented exceptions, e.g. scripts/value-scan.sh's CapitalOne
      #      carve-out) before excepting it: every public function boundary
      #      in that file is i64 cents in, i64 cents out (`quantile`,
      #      `prediction_half_width`, `band_of` and its `SpendBand` fields)
      #      — f64 is used ONLY as statistical-computation scratch space
      #      (quantile interpolation fraction, mean/variance/stddev, a
      #      Student's-t lookup table), never to store, compare, or
      #      serialize a money value. The one f64 use that ISN'T
      #      pure-statistics scratch (a relative-error ratio at line ~447)
      #      is inside `#[cfg(test)] mod tests` — genuinely test code the
      #      rule's own rationale already exempts, just not reachable by
      #      this find command's directory-only (`-not -path '*/tests/*'`)
      #      test exclusion, which cannot see an inline test module inside
      #      a src/ file. The file is excepted ENTIRELY below (round-2
      #      review finding: an earlier version of this comment claimed a
      #      future edit outside the verified scratch-math usage would
      #      still be caught, which was false — the whole file is skipped,
      #      so a NEW money-as-float bug landing directly in layer2.rs
      #      would not be). The separate "layer2.rs public API boundaries"
      #      step below is the real backstop for that: it specifically
      #      re-checks this one file's `pub` surface (the actual invariant
      #      to preserve — internal scratch math may keep using f64
      #      freely, but nothing PUBLIC may return, take, or store one) —
      #      confirmed to catch a synthetic `pub fn ... -> f64` planted in
      #      this exact file, not just in an unrelated one.
      - name: Forbid floating-point in money-critical crates
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          files=$(find crates/core-* crates/forecast-engine -name '*.rs' \
            -not -path '*/tests/*' \
            -not -name 'layer2.rs' \
            2>/dev/null || true)
          found=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            hits=$(sed 's://.*::' "$f" | grep -nE '\bf(32|64)\b' || true)
            if [ -n "$hits" ]; then
              while IFS= read -r hit; do
                echo "$f:$hit"
              done <<< "$hits"
              found=1
            fi
          done <<< "$files"
          if [ "$found" -eq 1 ]; then
            echo "::error::floating-point types are forbidden in money-critical crates (use integer minor units)"
            exit 1
          fi
          echo "No floating-point types in money-critical crate source."

      # personal-cfo-fkt5.7 round-2 review finding 3: layer2.rs is excepted
      # ENTIRELY from the check above (it's excluded by filename, not by a
      # more surgical per-line rule), so that check alone would miss a real
      # money-as-float bug landing directly in this one file. This step is
      # the actual backstop for that: it re-checks ONLY layer2.rs, and only
      # its `pub` surface — a `pub fn`/`pub <field>` line naming f32/f64
      # anywhere on it (return type, parameter, or field type) fails, while
      # non-`pub` lines (the file's genuine, already-verified scratch-math
      # use — quantile interpolation, mean/variance/stddev, the Student's-t
      # table) are left alone. Comment-stripped the same way as the check
      # above, for the same reason (a doc comment naming "f64" isn't code).
      - name: layer2.rs public API boundaries stay integer-cent
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          f=crates/forecast-engine/src/layer2.rs
          if [ -f "$f" ]; then
            hits=$(sed 's://.*::' "$f" | grep -nE '^\s*pub\b.*\bf(32|64)\b' || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while IFS= read -r hit; do echo "$f:$hit"; done
              echo "::error::layer2.rs's public API must stay integer-cent — f32/f64 is only allowed as internal scratch space, never on a pub boundary"
              exit 1
            fi
          fi
          echo "layer2.rs public API boundaries OK."

      # The pure-types crates (core-ids, core-ledger, core-money), the pure
      # crypto crate (vault-crypto), the pay-schedule engine, the deterministic
      # Future Cash forecast engine (forecast-engine) and the Sync format crate
      # (sync-core) must not pull in a database, async runtime, or the Tauri
      # shell — they are domain value types / a database-free KDF / pure
      # functions only (plan §9.4, §13.3; vault-crypto per personal-cfo-j0o;
      # forecast-engine per personal-cfo-164u; sync-core per personal-cfo-915.10,
      # so a Sync server can parse envelopes and manifests without SQLCipher).
      # Checks the resolved dependency tree, so transitive leaks are caught too.
      - name: Enforce pure-types crate boundaries
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for crate in core-ids core-money core-ledger vault-crypto pay-schedule forecast-engine sync-core; do
            if [ -d "crates/$crate" ]; then
              if cargo tree -e normal -p "$crate" 2>/dev/null | grep -iE '\b(tokio|tauri|rusqlite)\b'; then
                echo "::error::$crate must not depend on tokio/tauri/rusqlite (pure-types crate)"
                exit 1
              fi
            fi
          done
          echo "Pure-types crate boundaries OK."

      # The transaction-display read model is derived: only the projection module
      # may write it. Command code (lib.rs) must never INSERT/UPDATE/DELETE it
      # (plan beads personal-cfo-9x4 + lxj).
      - name: Read model is written only by the projection module
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -f crates/db-worker/src/lib.rs ]; then
            if grep -nE '(INSERT|UPDATE|DELETE)[^;]*transaction_display_rows_read_model' crates/db-worker/src/lib.rs; then
              echo "::error::command code must not write the transaction-display read model (use the projection module)"
              exit 1
            fi
          fi
          echo "Read model write-boundary OK."

      # db-worker is the single owner of the SQLCipher connection: it must be the
      # only crate that declares a dependency on rusqlite (plan §2.6, klr.3).
      - name: Only db-worker may depend on rusqlite
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          offenders=$(grep -rl '^rusqlite' crates/*/Cargo.toml 2>/dev/null \
            | grep -v '^crates/db-worker/Cargo.toml' || true)
          if [ -n "$offenders" ]; then
            echo "::error::only db-worker may depend on rusqlite; found: $offenders"
            exit 1
          fi
          echo "rusqlite is owned solely by db-worker."

      # The connector contract crate (personal-cfo-x6dr, ADR 0004/0060): an
      # adapter can never write the ledger, so connector-core must not depend
      # on db-worker — and stays a pure contract crate (no DB/async/Tauri).
      # The plain assignment makes a cargo-tree failure fail the step (set -e)
      # instead of an empty grep input silently passing.
      - name: Enforce connector-core compile barrier
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          tree=$(cargo tree -e normal -p connector-core)
          if grep -iE '\b(db-worker|rusqlite|tokio|tauri)\b' <<<"$tree"; then
            echo "::error::connector-core must not depend on db-worker/rusqlite/tokio/tauri (personal-cfo-x6dr compile barrier)"
            exit 1
          fi
          # Adapter crates handle money-shaped network data and inherit the
          # same barrier: staged output only, no ledger access, no async shell.
          for manifest in crates/connectors/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            crate=$(basename "$(dirname "$manifest")")
            tree=$(cargo tree -e normal -p "$crate")
            if grep -iE '\b(db-worker|rusqlite|tokio|tauri)\b' <<<"$tree"; then
              echo "::error::$crate must not depend on db-worker/rusqlite/tokio/tauri (ADR 0004 / personal-cfo-x6dr barrier)"
              exit 1
            fi
          done
          echo "connector compile barriers OK."

      # The mock connector (personal-cfo-1s2b) is test-only: the non-default
      # `mock` feature may be enabled from [dev-dependencies] only. This grep
      # stands in for the cargo-deny rule the bead AC named (the workspace has
      # no cargo-deny); it scans each manifest's [dependencies] section for a
      # connector-core entry enabling the feature.
      - name: Forbid the connector mock in production dependencies
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          offenders=""
          while IFS= read -r manifest; do
            if awk '
              /^\[dependencies\]$/                 {mode="deps"; next}
              /^\[dependencies\.connector-core\]/  {mode="cc";   next}
              /^\[/                                {mode=""}
              mode=="deps" && /connector-core.*mock/ {found=1}
              mode=="cc"   && /features.*mock/       {found=1}
              END {exit !found}
            ' "$manifest"; then
              offenders="$offenders $manifest"
            fi
          done < <(find crates apps -name Cargo.toml -not -path '*/target/*')
          if [ -n "$offenders" ]; then
            echo "::error::connector-core's mock feature is test-only; remove it from [dependencies] in:$offenders (personal-cfo-1s2b)"
            exit 1
          fi
          echo "connector mock stays out of production dependencies."

      # Connector registry review cadence (ADR 0015 §7, personal-cfo-5jjz): a
      # provider's cost or terms review older than six months is a WARNING
      # annotation, never a failure — it asks a human to re-check the
      # provider's pages without blocking unrelated releases.
      - name: Connector registry review cadence (warning only)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: cargo run --quiet -p connector-core --example registry_review

      # Importer plugins register at COMPILE TIME (personal-cfo-eay) and parse
      # untrusted bytes behind the isolation boundary (ADR 0022): no runtime
      # dynamic loading, and no database / async runtime / Tauri shell in the
      # parsing crates (a plugin holds no keys, DB, network, or IPC).
      - name: Enforce importer isolation boundaries
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -d crates/importers ]; then
            # (a) No dynamic-loading crate as a dependency (the realistic vector).
            if grep -rniE '^[[:space:]]*(libloading|dlopen2?)[[:space:]]*=' \
                 crates/importers --include=Cargo.toml 2>/dev/null; then
              echo "::error::dynamic-loading crates (libloading/dlopen) are forbidden in importer crates (ADR 0022)"
              exit 1
            fi
            # (b) No raw loader FFI in source. Comments are stripped first so prose
            #     that NAMES the ban (these crates' own docs) does not trip it.
            if find crates/importers -name '*.rs' -exec sed 's://.*::' {} + 2>/dev/null \
                 | grep -nE '\b(libloading|dl(open|sym|mopen|close|fcn))\b' >/dev/null; then
              echo "::error::dynamic-loading symbols are forbidden in importer source (ADR 0022; use compile-time inventory registration)"
              exit 1
            fi
            # (c) No database / async runtime / Tauri shell in the parsing crates.
            for manifest in crates/importers/*/Cargo.toml; do
              [ -f "$manifest" ] || continue
              crate=$(basename "$(dirname "$manifest")")
              if cargo tree -e normal -p "$crate" 2>/dev/null | grep -iE '\b(tokio|tauri|rusqlite|ureq|reqwest|hyper|curl)\b'; then
                echo "::error::$crate must not depend on tokio/tauri/rusqlite or an HTTP client (parsers have no DB/async/Tauri/network; ADR 0022)"
                exit 1
              fi
            done
          fi
          echo "Importer isolation boundaries OK."

  # The ABSOLUTE write-set capture budget (under 3 ms added per command), as a job that is NOT a
  # required check (personal-cfo-g3m.16, owner decision personal-cfo-915.15 option C). The
  # required test of the same cost is relative; the absolute number varies about 20x between a
  # laptop and a loaded hosted runner, so it must not be able to stall a merge. This job runs the
  # ignored test, prints the numbers into the check's step summary with the runner type (the
  # per-runner record the Definition of Done asks for), and may go red without blocking anything.
  # It is deliberately absent from the ruleset's required checks.
  perf-budget:
    name: Perf budget (absolute, not required)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'

      - name: Absolute perf budgets and the timed slowdown proof (every #[ignore]d test)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/perf.txt"
          status=0
          # Both tests are #[ignore]d from the required run; this non-required job runs them
          # and reports the numbers. The REQUIRED proof that the relative check can fail is the
          # deterministic predicate test in the Rust job.
          # Only the perf tests: other #[ignore]d tests in these crates are helpers, not budgets.
          cargo test -p db-worker -p job-runtime -- --ignored --nocapture --test-threads=1 \
            write_set_tests::the_capture_stays_inside_the_absolute_budget \
            write_set_tests::the_relative_check_rejects_a_much_slower_capture \
            rebuild_stays_inside_the_absolute_budget \
            db_cancel_request_reaches_a_running_handler_within_the_sla \
            cancellation_is_visible_within_the_absolute_sla 2>&1 \
            | tee "$out" || status=$?
          absolute=$(grep 'ABSOLUTE' "$out" || echo "no measurement line printed")
          slowed=$(grep 'write-set capture SLOWED' "$out" || echo "no measurement line printed")
          {
            echo "### Perf budget: write-set capture (not a required check)"
            echo "Runner: ${RUNNER_OS} ${RUNNER_ARCH} (${RUNNER_ENVIRONMENT:-unknown})."
            echo "Absolute budgets: write-set capture under 3000 us added per command; transaction rebuild of 300 accounts under 2 s; cancellation under 500 ms."
            echo '```'
            echo "$absolute"
            echo '```'
            echo "Timed slowdown proof (the relative check must reject it; it needs a ratio of 4x or more):"
            echo '```'
            echo "$slowed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  frontend:
    name: Frontend (apps/desktop)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            code:
              - 'apps/desktop/**'
              - '!apps/desktop/src-tauri/**'
              - 'scripts/check-dist-csp.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Lint
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: pnpm lint

      - name: Test
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: pnpm test

      - name: Build
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: pnpm -r build

      # personal-cfo-0hp6, ADR 0010: the built HTML must not contain anything that
      # changes the EFFECTIVE CSP — a <style> element (Tauri would add a style-src
      # nonce, which disables the accepted 'unsafe-inline'), an inline script, or a
      # remote script/stylesheet.
      - name: Built HTML keeps the CSP effective (ADR 0010)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: node scripts/check-dist-csp.mjs apps/desktop/dist

  # The IPC command surface (personal-cfo-40t): compile the standalone desktop
  # crate, run its Rust gates, and prove the generated TypeScript bindings are
  # in sync with the Rust types. The standalone crate is excluded from the root
  # `rust` job's `cargo --workspace`, so it gets its own gates here.
  ipc-codegen:
    name: IPC codegen (apps/desktop/src-tauri)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # personal-cfo-fkt5.7 round-2 review finding: the desktop crate isn't a
      # self-contained Rust workspace — apps/desktop/src-tauri/Cargo.toml has
      # six `path = "../../../crates/..."` dependencies (finance-kernel,
      # csv-importer, ofx-importer, connector-core, simplefin-adapter,
      # observability), so this job's own compile/test/bindings-sync gates
      # only mean anything if a change to any of THOSE crates also runs
      # them. `crates/**` is included below for exactly that reason — not
      # narrowed to the six specific paths, since a new path dependency
      # added later shouldn't also require remembering to widen this list.
      # apps/desktop/src/bindings.ts is included too: it's the generated
      # file the "TypeScript bindings are in sync" step below compares
      # against, and sits outside apps/desktop/src-tauri/** entirely, so a
      # hand-edit to the generated file itself needs to trigger that check
      # as well, not just a source-side regeneration.
      - name: Detect changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            code:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src/bindings.ts'
              - 'apps/desktop/public/isolated-shell.html'
              # The npm half of the Tauri family (personal-cfo-io42): an npm-only
              # Tauri bump must still run tests/tauri_pins.rs, the capability suite
              # and the runtime probe.
              - 'apps/desktop/package.json'
              - 'pnpm-lock.yaml'
              - 'crates/**'
              - '.github/workflows/ci.yml'

      # ADR 0010: the WebView must always have a Content Security Policy. Fail
      # fast if app.security.csp regresses to null (the gap this ADR closed).
      - name: Content Security Policy is configured (ADR 0010)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          sec = json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["app"]["security"]
          if not sec.get("csp"):
              print("::error::app.security.csp must not be null (ADR 0010 — the WebView needs a Content Security Policy)")
              sys.exit(1)
          print("CSP present.")
          PY

      # Tauri 2 Linux build dependencies (webkit2gtk, gtk, …). SQLCipher and
      # OpenSSL are compiled from vendored sources by rusqlite, so no database
      # system libraries are required.
      - name: Install Tauri system dependencies
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            xvfb

      # The pinned toolchain comes from rust-toolchain.toml (rustup honors it).
      - name: Show toolchain
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        with:
          workspaces: apps/desktop/src-tauri

      # A dev-profile build serves assets from the dev URL and does not embed
      # the frontend, so a placeholder `dist/` is all `tauri-build` needs. The
      # real bundle is built by the frontend job (and, later, personal-cfo-rhci).
      - name: Placeholder frontend dist
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>codegen</title>' > apps/desktop/dist/index.html

      - name: Rust gates (desktop crate)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Declared MSRV for the standalone desktop graph (ADR 0001 addendum
      # 2026-09-28, personal-cfo-g3m.5): it must equal the root workspace's and
      # build with that exact compiler, including the bindings-export feature.
      - name: Declared MSRV builds (desktop crate)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          desktop=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[0].rust_version')
          root=$(cd ../../.. && cargo metadata --format-version 1 --no-deps --locked | jq -r '[.packages[].rust_version] | unique | join(" ")')
          if [ "$desktop" != "$root" ]; then
            echo "::error::desktop rust-version ($desktop) must equal the root workspace's ($root)"
            exit 1
          fi
          echo "Declared MSRV: $desktop"
          rustup toolchain install "$desktop" --profile minimal
          cargo +"$desktop" check --locked --all-targets
          cargo +"$desktop" check --locked --features export-bindings,tauri/custom-protocol

      # Regenerate the bindings and fail if the committed file is stale. This is
      # the enforced Rust↔TS schema-sync gate (personal-cfo-40t / rs1v).
      - name: TypeScript bindings are in sync
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo run --quiet --bin export_bindings --features export-bindings
          if ! git diff --exit-code ../src/bindings.ts; then
            echo "::error::apps/desktop/src/bindings.ts is stale — run 'cargo run --bin export_bindings --features export-bindings' in apps/desktop/src-tauri and commit the result."
            exit 1
          fi

      # personal-cfo-0hp6, ADR 0010: prove isolation in a REAL WebView, not just in
      # configuration. A debug build with Tauri's `custom-protocol` feature serves
      # the bundled origin (tauri://localhost) under the production CSP; the
      # debug-only probe (src/isolation_probe.rs) opens main and both untrusted
      # shells, and in each checks IPC rejection, the effective CSP (inline script,
      # eval and remote fetch refused; inline style still applied), window.open and
      # remote navigation (which must be cancelled by the navigation guard itself,
      # counted per window), then exits non-zero on any failure. The placeholder
      # dist is enough — the probe injects its own script — plus the shells' page.
      # Scratch data directory only. No remote host is contacted: every target is
      # in the reserved .invalid domain, and every check requires positive
      # evidence of a refusal, so none depends on the network.
      - name: Runtime isolation probe (real WebView, ADR 0010)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cp ../public/isolated-shell.html ../dist/isolated-shell.html
          cargo build --features tauri/custom-protocol
          report="$RUNNER_TEMP/isolation-probe.json"
          PCFO_DATA_DIR="$(mktemp -d)" PCFO_ISOLATION_PROBE="$report" \
          GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 180 xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' \
            ./target/debug/personal-cfo-desktop
          echo "Isolation probe passed; report: $report"

  # personal-cfo-xcrsk (LIN-1): exploratory Linux AppImage proof. This is
  # deliberately manual and is NOT a required check: the result feeds ADR
  # 0079, but Linux is not a release tier until that ADR is accepted. The job
  # records the runner floor, builds the real frontend-backed AppImage, launches
  # it under Xvfb, and uploads the screenshot/log/AppImage evidence.
  linux-appimage-spike:
    name: Linux AppImage spike (manual)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux build and GUI-smoke dependencies
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-appimage-spike"
          mkdir -p "$artifact_dir"
          packages=(
            build-essential
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libssl-dev
            patchelf
            xvfb
            xdotool
            imagemagick
          )
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
          printf '%s\n' "${packages[@]}" > "$artifact_dir/linux-spike-apt-packages.txt"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: 22
          cache: pnpm

      - name: Record Linux runner floor
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-appimage-spike"
          mkdir -p "$artifact_dir"
          {
            echo '--- /etc/os-release ---'
            cat /etc/os-release
            echo '--- uname ---'
            uname -a
            echo "glibc: $(getconf GNU_LIBC_VERSION)"
            echo "webkit2gtk-4.1-dev: $(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-dev)"
            echo "gtk-3-dev: $(dpkg-query -W -f='${Version}' libgtk-3-dev)"
            echo "pnpm: $(pnpm --version)"
            echo "node: $(node --version)"
            rustc -Vv
          } | tee "$artifact_dir/linux-spike-versions.txt"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Build AppImage and capture warnings
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-appimage-spike"
          mkdir -p "$artifact_dir"
          build_log="$artifact_dir/build.log"
          /usr/bin/time -f 'build_seconds=%e' -o "$artifact_dir/build-time.txt" \
            pnpm tauri build --bundles appimage \
              --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee "$build_log"
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [ -n "$appimage" ] || { echo '::error::Tauri did not produce an AppImage'; exit 1; }
          cp "$appimage" "$artifact_dir/DohFlow.AppImage"
          chmod +x "$artifact_dir/DohFlow.AppImage"
          stat --printf='appimage_bytes=%s\n' "$appimage" | tee "$artifact_dir/appimage-size.txt"
          grep -iE 'warning|icon|desktop' "$build_log" > "$artifact_dir/build-warnings.txt" || \
            echo 'No build warnings mentioning icons or desktop entries.' > "$artifact_dir/build-warnings.txt"
          printf 'appimage_path=%s\n' "$appimage" > "$artifact_dir/build-metadata.txt"

      - name: Verify capability and CSP regression suite on Linux
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("apps/desktop/src-tauri/tauri.conf.json", encoding="utf-8") as fh:
              csp = json.load(fh)["app"]["security"].get("csp")
          if not csp:
              raise SystemExit("CSP is missing")
          print(f"CSP present ({len(csp)} characters).")
          PY
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test acl_coverage -- --nocapture

      - name: Probe SQLCipher feature and linked versions on Linux
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-appimage-spike"
          probe='crates/finance-kernel/examples/linux_sqlcipher_probe.rs'
          cleanup() { rm -f "$probe"; }
          trap cleanup EXIT
          mkdir -p "$(dirname "$probe")"
          cat > "$probe" <<'RS'
          use finance_kernel::Kernel;

          fn main() {
              let dir = std::env::temp_dir().join(format!("dohflow-linux-sqlcipher-{}", std::process::id()));
              std::fs::create_dir_all(&dir).expect("create probe dir");
              let db_path = dir.join("vault.db");
              let kernel = Kernel::create_vault(&db_path, b"linux-spike-password").expect("create vault");
              println!("PRAGMA cipher_version={}", kernel.cipher_version().expect("cipher version"));
              println!("rusqlite sqlite_version={}", finance_kernel::sqlite_version());
              drop(kernel);
              let _ = std::fs::remove_dir_all(dir);
          }
          RS
          grep -n 'bundled-sqlcipher-vendored-openssl' Cargo.toml | tee "$artifact_dir/rusqlite-feature.txt"
          cargo tree -p db-worker -e features > "$artifact_dir/rusqlite-feature-tree.txt"
          cargo run --quiet -p finance-kernel --example linux_sqlcipher_probe | tee "$artifact_dir/sqlcipher-versions.txt"

      - name: Measure Argon2id interactive profile on Linux
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-appimage-spike"
          probe='crates/vault-crypto/examples/linux_argon2_timing.rs'
          cleanup() { rm -f "$probe"; }
          trap cleanup EXIT
          mkdir -p "$(dirname "$probe")"
          cat > "$probe" <<'RS'
          use std::time::Instant;
          use vault_crypto::{derive_kek, generate_salt, Profile};

          fn main() {
              let profile = Profile::InteractiveDefault;
              let params = profile.params();
              let salt = generate_salt().expect("salt");
              let password = b"linux-spike-password";
              let mut samples = Vec::new();
              for _ in 0..5 {
                  let start = Instant::now();
                  let _ = derive_kek(password, &salt, &params).expect("derive");
                  samples.push(start.elapsed());
              }
              samples.sort_unstable();
              let median_ms = samples[samples.len() / 2].as_secs_f64() * 1000.0;
              println!("Argon2id profile={:?} memory_kib={} time_cost={} parallelism={} median_unlock_ms={median_ms:.2}", profile, params.memory_kib, params.time_cost, params.parallelism);
          }
          RS
          cargo run --quiet -p vault-crypto --example linux_argon2_timing | tee "$artifact_dir/argon2-timing.txt"

      - name: Verify updater behavior without a Linux channel
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/linux-appimage-spike/updater-behavior.txt"
          import json
          with open("apps/desktop/src-tauri/tauri.conf.json", encoding="utf-8") as fh:
              config = json.load(fh)
          endpoints = config["plugins"]["updater"]["endpoints"]
          assert endpoints == ["https://github.com/dohflow/dohflow/releases/latest/download/latest.json"]
          assert not any("linux" in endpoint.lower() for endpoint in endpoints)
          print("Updater plugin configuration loaded with the macOS release endpoint only.")
          print("No Linux endpoint is configured; the launch smoke below verifies plugin initialization does not block the locked vault screen.")
          PY

      - name: Launch AppImage under Xvfb and capture the vault screen
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-appimage-spike"
          appimage="$artifact_dir/DohFlow.AppImage"
          log="$artifact_dir/launch.log"
          screenshot="$artifact_dir/vault-screen.png"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' \
            bash -s -- "$appimage" "$log" "$screenshot" <<'SMOKE'
          set -euo pipefail
          appimage="$1"
          log="$2"
          screenshot="$3"
          data_dir="$(mktemp -d "${RUNNER_TEMP}/dohflow-linux-data.XXXXXX")"
          cleanup() {
            if [ -n "${pid:-}" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
            if [ -n "${pid:-}" ]; then
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            PCFO_DATA_DIR="$data_dir" "$appimage" --appimage-extract-and-run > "$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'AppImage exited before a vault window appeared.' >&2
              cat "$log" >&2 || true
              exit 1
            fi
            window="$(xdotool search --name 'DohFlow' 2>/dev/null | head -n1 || true)"
            if [ -n "$window" ]; then
              title="$(xdotool getwindowname "$window" 2>/dev/null || true)"
              captured=0
              rendered=0
              render_stats=''
              color_count=''
              for attempt in $(seq 1 10); do
                if import -window "$window" "$screenshot" 2>>"$log"; then
                  captured=1
                  if [ -s "$screenshot" ]; then
                    render_stats="$(identify -format '%[fx:mean]' "$screenshot" 2>/dev/null || true)"
                    color_count="$(identify -format '%k' "$screenshot" 2>/dev/null || true)"
                    if awk -v mean="$render_stats" -v colors="$color_count" 'BEGIN { exit !(mean > 0.01 && colors > 1) }'; then
                      rendered=1
                      break
                    fi
                    echo "Screenshot has no rendered pixels (mean/colors: ${render_stats:-unavailable}/${color_count:-unavailable}); retrying." >> "$log"
                  fi
                fi
                sleep 1
              done
              if [ "$captured" -ne 1 ] || [ "$rendered" -ne 1 ]; then
                echo "Unable to capture a rendered X11 window $window after 10 attempts." >&2
                xdotool getwindowgeometry "$window" >&2 || true
                exit 1
              fi
              printf 'DohFlow vault screen detected: window=%s title=%s process=%s rendered_pixels=%s colors=%s\n' "$window" "$title" "$pid" "$render_stats" "$color_count" | tee -a "$log"
              exit 0
            fi
            sleep 1
          done
          echo 'Timed out waiting for the DohFlow vault window.' >&2
          cat "$log" >&2 || true
          exit 1
          SMOKE
          grep -q 'DohFlow vault screen detected' "$log"
          [ -s "$screenshot" ]

      - name: Upload Linux AppImage spike evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage-spike-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-appimage-spike/
          if-no-files-found: warn
          retention-days: 14

  # personal-cfo-rr0lm (DIST-5): proves the x86_64 slice of the universal
  # binary (ADR 0072) actually builds AND launches, on a REAL native Intel
  # runner — so Track D never depends on owning an Intel Mac, and the
  # ~doubled build time of a universal build gets verified off the 8 GB
  # build Mac instead of on it. NO SECRETS (D9a): this job references no
  # `secrets.*` at all — it is not release signing (D9b, which stays local
  # on the build Mac) — so it would be safe on a fork PR by GitHub's own
  # default, though it does not run on pull_request at all (push:main and
  # workflow_dispatch only, per personal-cfo-rr0lm's own AC), to keep every
  # contributor PR from paying a ~2x-build-time macOS-Intel job.
  # What this job does NOT prove: Gatekeeper acceptance, notarization, or a
  # signed artifact — see docs/development/desktop-app.md.
  intel-smoke:
    name: Intel build + launch smoke (macos-15-intel)
    runs-on: macos-15-intel
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.repository.private == false)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pinned toolchain comes from rust-toolchain.toml (rustup honors it).
      - name: Show toolchain
        run: rustup show

      # A universal build needs BOTH slices installed — confirmed live on a
      # real macos-15-intel runner, which ships x86_64-apple-darwin natively
      # but NOT aarch64-apple-darwin (the mirror image of a build Mac, which
      # ships aarch64 natively but not x86_64 — see scripts/release.sh's own
      # preflight). Both calls are idempotent no-ops if already installed.
      - name: Install both Darwin targets (ADR 0072 — universal build)
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # A real launch smoke should exercise the real bundled frontend, not a
      # placeholder — unlike the Linux-hosted ipc-codegen job above, which
      # only compile-checks Rust and never actually launches the binary.
      - name: Install desktop app dependencies (pulls in @tauri-apps/cli)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        working-directory: apps/desktop
        run: pnpm build

      # App bundle only — no DMG, no code signing, no updater artifacts.
      # D9b (release signing) stays on the local build Mac; this job proves
      # the binary builds and runs, nothing about its distribution form.
      - name: Build universal binary (ADR 0072)
        working-directory: apps/desktop
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the binary is genuinely universal (lipo -archs)
        run: |
          set -euo pipefail
          binary="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/DohFlow.app/Contents/MacOS/personal-cfo-desktop"
          [ -f "$binary" ] || { echo "::error::expected binary not found: $binary"; exit 1; }
          archs="$(lipo -archs "$binary")"
          echo "lipo -archs: $archs"
          case " $archs " in *' arm64 '*) ;; *) echo "::error::missing arm64 slice — lipo -archs reported: $archs"; exit 1 ;; esac
          case " $archs " in *' x86_64 '*) ;; *) echo "::error::missing x86_64 slice — lipo -archs reported: $archs"; exit 1 ;; esac

      # Launch smoke: the binary starts, setup() completes (vault-registry
      # bootstrap, data-dir resolution — ADR 0070), and it exits 0 ON ITS
      # OWN via PCFO_SMOKE_TEST_EXIT — no display, no vault, no secrets
      # needed. A hang would mean setup() blocked; a non-zero/early exit
      # would mean it panicked — both fail this step instead of hanging CI.
      - name: Launch smoke (headless, no display required)
        run: |
          set -euo pipefail
          binary="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/DohFlow.app/Contents/MacOS/personal-cfo-desktop"
          log="$(mktemp)"
          PCFO_SMOKE_TEST_EXIT=1 "$binary" > "$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::smoke launch did not exit within 30s — killing"
            kill -9 "$pid" 2>/dev/null || true
            cat "$log"
            exit 1
          fi
          wait "$pid"
          code=$?
          echo "── captured stdout/stderr ──"
          cat "$log"
          echo "── exit code: $code ──"
          [ "$code" -eq 0 ] || { echo "::error::smoke launch exited $code, expected 0"; exit 1; }
          [ -s "$log" ] || { echo "::error::smoke launch produced no output"; exit 1; }
          grep -qF "DohFlow smoke test" "$log" || { echo "::error::expected confirmation line missing from output"; exit 1; }

  # Secret + dependency scanning (personal-cfo-6r6 / -7t7). Runs unconditionally
  # (visibility guard only, no path filter — see the workflow-level comment) on
  # every trigger including the weekly schedule; the same commands run locally
  # too (see docs/security/scanning.md).
  security-scan:
    name: Security scanning (secrets + dependencies)
    runs-on: ubuntu-24.04
    # `schedule` is deliberately let PAST the job-level guard here (unlike
    # every other job, which excludes it outright) and re-checked for real by
    # this job's own first step below — see that step's comment for why the
    # ordinary `github.event.repository.private == false` form cannot
    # distinguish public from private for a scheduled run.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false || github.event_name == 'schedule'
    steps:
      # personal-cfo-fkt5.7 round-2 review finding: a `schedule` event's
      # payload has NO `repository` object at all (confirmed:
      # https://github.com/orgs/community/discussions/12269), so
      # `github.event.repository.private == false` — this job's own guard,
      # same as every other job's — silently evaluates to TRUE for a
      # scheduled run regardless of the repo's real visibility. GitHub's
      # expression language coerces both `null` and `false` to `0` for an
      # equality comparison, so `null == false` is `true`: the guard that
      # correctly reads "still private, do nothing" for push/pull_request
      # instead reads "go ahead" for schedule. There is no purely
      # expression-language fix — `schedule` payloads carry no visibility
      # signal to check at all — so this step asks the REST API directly,
      # in-job-filtering style (the same pattern `steps.filter.outputs.code`
      # uses for paths elsewhere in this file, applied to visibility
      # instead): every step below is gated on this step's `run` output,
      # which is unconditionally `true` for every non-schedule event (their
      # job-level guard already handled visibility correctly) and reflects
      # the real, current API-queried visibility only when the trigger
      # actually is `schedule`.
      - name: Resolve visibility (schedule events only)
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            is_private=$(gh api "repos/${{ github.repository }}" --jq .private)
            if [ "$is_private" = "false" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Repository is still private; skipping this scheduled run."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.visibility.outputs.run == 'true'
        with:
          fetch-depth: 0 # gitleaks scans the full commit history

      # Which scans are REQUIRED to pass on this change (personal-cfo-md8h2.14, owner
      # decision personal-cfo-915.15 option B). The advisory scans (cargo audit and
      # pnpm audit) read an advisory database that changes under us, so on a pull
      # request or merge group that touches no dependency they would block unrelated
      # work with a failure nobody introduced. They run when a pull request or merge
      # group changes a manifest, a lockfile or the audit setup (see
      # scripts/dependency-change-check.sh), and always on a push to main, a schedule
      # or a manual dispatch; the daily advisory-audit workflow watches main.
      # Secrets scanning, the real-value scan, the ADR tier check and the LICENSE
      # scans do NOT depend on the advisory database and run on every change. The
      # job (and so the required check name) always runs and reports success, with
      # an explicit message, when the advisory scans are not needed: never a
      # silently skipped required check. If the diff itself fails, the job fails.
      - name: Decide whether the advisory scans are required
        id: deps
        if: steps.visibility.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) changed=$(git diff --name-only HEAD^1 HEAD) ;;
            merge_group) changed=$(git diff --name-only "$MG_BASE" "$MG_HEAD") ;;
            *)
              echo "advisory=true" >> "$GITHUB_OUTPUT"
              echo "Event '$EVENT': the advisory scans run in full."
              exit 0 ;;
          esac
          # Exit 0/1 of the checker mean "changed"/"not changed"; anything else fails the step.
          result=$(printf '%s\n' "$changed" | bash scripts/advisory-scans-required.sh)
          echo "$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != "advisory=true" ]; then
            echo "::notice title=Advisory scans not required::No dependency or audit-config change in this ${EVENT}; cargo audit and pnpm audit are skipped by design. The daily main audit covers advisories."
          fi

      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        if: steps.visibility.outputs.run == 'true'
        with:
          tool: cargo-audit,cargo-deny

      # taiki-e/install-action has no gitleaks manifest at all (confirmed:
      # no manifests/gitleaks.json in that repo) and its cargo-binstall
      # fallback can never work for it either — gitleaks is a Go binary,
      # never published to crates.io. This went undetected for months
      # because this whole workflow was workflow_dispatch-only and, per
      # this branch's own real run history, was never actually dispatched
      # after gitleaks was added to this job — personal-cfo-fkt5.7's own
      # required verification run is what caught it for the first time.
      # Installed directly from gitleaks' own GitHub releases instead,
      # checksum-verified against that release's published SHA256SUMS
      # (the direct-binary equivalent of the SHA-pinning every Action in
      # this file gets — there's no source to pin a commit of here, only a
      # released binary, so a checksum is the trust mechanism instead).
      - name: Install gitleaks
        if: steps.visibility.outputs.run == 'true'
        run: |
          set -euo pipefail
          version=8.30.1
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          asset="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          echo "${checksum}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Secret scanning (6r6): fail on any committed credential. The .gitleaks.toml
      # allowlist excludes generated bead data + the redaction-test fixtures, which
      # embed secret-shaped strings by design (personal-cfo-zobt).
      - name: Secret scan (gitleaks)
        if: steps.visibility.outputs.run == 'true'
        run: gitleaks detect --config .gitleaks.toml --no-banner --redact

      # Real-value scan (personal-cfo-o1nxk item 10) — a different,
      # complementary risk from gitleaks above: real bank/brokerage names,
      # SSN-shaped strings, card-number-shaped strings — none of which are
      # "secrets," but all of which would be a privacy incident. Runs
      # against the COMMITTED tree (this is exactly why this step exists:
      # two real bugs in this script — see its own header comment — were
      # each caught only by a reviewer running it against a tree the
      # implementer's own working copy hadn't yet committed; a CI step
      # against the actual pushed tree closes that gap structurally rather
      # than relying on remembering to re-run it by hand).
      - name: Real-value scan (bank names, SSN/card shapes)
        if: steps.visibility.outputs.run == 'true'
        run: ./scripts/value-scan.sh

      # ADR 0082 disclosure-boundary tripwire (personal-cfo-0uxwt) — rides on
      # this already-required job rather than adding a new required check to
      # the branch-protection ruleset. Business-tier phrases in docs/adr/ or
      # docs/research/ mean a business decision was written into the public
      # repo instead of dohflow/internal.
      - name: ADR tier check (business phrases in docs/adr, docs/research)
        if: steps.visibility.outputs.run == 'true'
        run: ./scripts/adr-tier-check.sh

      # Dependency scanning (7t7) — both Cargo workspaces (root + the standalone
      # desktop crate). Fails on a known-vulnerable crate; unmaintained-advisory
      # warnings (e.g. Tauri's Linux-only GTK3 deps) are informational by default.
      # scripts/cargo-audit.py runs `cargo audit` on both lockfiles. Any vulnerability fails;
      # its only allowance mechanism is a scoped, dated exception matched by advisory + crate
      # + version (never id alone) that also fails once it matches nothing. There are no
      # exceptions today (see the script for the history).
      - name: Dependency scan — Rust (cargo audit)
        if: steps.visibility.outputs.run == 'true' && steps.deps.outputs.advisory == 'true'
        run: |
          set -euo pipefail
          python3 -I scripts/cargo-audit.py
          bash scripts/tests/cargo-audit.test.sh

      - name: Advisory scans not required for this change
        if: steps.visibility.outputs.run == 'true' && steps.deps.outputs.advisory != 'true'
        run: |
          echo "No dependency or audit-config change: cargo audit and pnpm audit are not required for this change (success, by design)."
          echo "Advisory scans: not required, no dependency change. The daily main audit watches advisories." >> "$GITHUB_STEP_SUMMARY"

      # AGPL-3.0-only dependency LICENSE audit (personal-cfo-o1nxk item 3) —
      # two separate Cargo workspaces, two deny.toml files (see either for the
      # full allowlist + rationale for every non-obvious entry).
      - name: Dependency license scan — Rust (cargo deny)
        if: steps.visibility.outputs.run == 'true'
        run: |
          set -euo pipefail
          cargo deny check licenses
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check licenses

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.visibility.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.visibility.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      # Dependency scanning (7t7) — the frontend dependency tree.
      - name: Install frontend dependencies
        if: steps.visibility.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Dependency scan — frontend (pnpm audit)
        if: steps.visibility.outputs.run == 'true' && steps.deps.outputs.advisory == 'true'
        run: pnpm audit --prod

      # AGPL-3.0-only dependency LICENSE audit (personal-cfo-o1nxk item 3) —
      # frontend equivalent of the cargo-deny steps above; no frontend
      # cargo-deny analogue exists, so this is a small hand-rolled script
      # against `pnpm licenses list --json` (see the script's own header for
      # why, and docs/security/scanning.md).
      - name: Dependency license scan — frontend
        if: steps.visibility.outputs.run == 'true'
        run: node scripts/check-frontend-licenses.mjs --prod

  # Shell script checks (personal-cfo-fkt5.7, folds in personal-cfo-2yncn):
  # every scripts/tests/*.test.sh file is CI-safe by construction — no
  # network, no real bead database (each stubs `bd` on PATH), no real
  # credentials — see each test's own header comment for details. Without
  # this job, a regression the tests exist to catch (e.g. the au76q
  # GIT_DIR incident) only gets caught when someone remembers to run them by
  # hand. Runs unconditionally (visibility guard only, no path filter — it's
  # already fast, a few seconds total, so there's nothing worth skipping).
  # shellcheck is deliberately NOT added here: not installed on the dev
  # machine, and would flag pre-existing style across all these scripts —
  # a separate question from "do the tests the repo already has actually run."
  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntax check (bash -n)
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/tests/*.test.sh; do
            bash -n "$f"
          done
          echo "All scripts/*.sh and scripts/tests/*.test.sh pass bash -n."

      - name: Run shell tests
        run: |
          set -euo pipefail
          for f in scripts/tests/*.test.sh; do
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
          done

  # Runner-image canary (personal-cfo-md8h2.19). Every required Linux job is pinned to a specific
  # Ubuntu image, because `ubuntu-latest` moved from 24.04 to 26.04 on 2026-10-24 and the new
  # image's Rust coreutils broke a shell test, which ejected pull requests from the merge queue.
  # This job runs the shell tests on `ubuntu-latest` (not pinned) so the NEXT image change shows
  # up here, as a red job that blocks nothing, before anyone moves the pin. It is deliberately
  # not a required check and not in `main-red-alert`'s needs.
  runner-canary:
    name: Runner image canary (ubuntu-latest, not required)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Which image, and does a symlink to sleep still work?
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "image: ${PRETTY_NAME} (ImageVersion ${ImageVersion:-unknown})"
          echo "sleep resolves to: $(readlink -f "$(command -v sleep)")"
          dir="$(mktemp -d)"
          ln -s "$(command -v sleep)" "$dir/hygtest-cargo"
          if "$dir/hygtest-cargo" 0; then
            echo "a symlink to sleep named hygtest-cargo works"
          else
            echo "a symlink to sleep named hygtest-cargo FAILS (exit $?): sleep is a multicall binary"
          fi

      - name: Run shell tests
        run: |
          set -euo pipefail
          for f in scripts/tests/*.test.sh; do
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
          done

  # The desktop crate still builds for a NON-desktop Apple target (personal-cfo-md8h2.12). The
  # self-update commands, plugins and capability grants are gated to desktop builds
  # (personal-cfo-i93n3.11), but nothing else compiles the crate for a non-desktop target, so a
  # change that registers one of them outside `cfg(desktop)` would break such a build unseen.
  # `cargo check` of the crate with its default features for aarch64-apple-ios-sim fails on it
  # (shown with a throwaway change: "cannot find `__cmd__apply_update`"). A generic portability
  # check of public code: it names no product. It needs the Apple SDK (SQLCipher and OpenSSL
  # compile from vendored C), so it runs on a macOS runner. Not a required check yet: whether it
  # becomes one is the owner's call via 00-overseer.
  desktop-nondesktop-check:
    name: Desktop crate (non-desktop target check)
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event.repository.private == false && github.event_name != 'schedule')
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # The desktop crate depends on crates/** by path, so a change there runs the check too.
      - name: Detect changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            code:
              - 'apps/desktop/src-tauri/**'
              - 'crates/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

      - name: Add the non-desktop target
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        with:
          workspaces: apps/desktop/src-tauri
          key: nondesktop-check

      - name: cargo check, desktop crate, aarch64-apple-ios-sim (default features)
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: cargo check --locked --target aarch64-apple-ios-sim --manifest-path apps/desktop/src-tauri/Cargo.toml

  # NOTE: Building the macOS release binary (with capability/CSP hardening and a
  # launch smoke test) is owned by bead personal-cfo-rhci and will be added as a
  # macOS job there.

  # Opens (or comments on) a `ci-main-red` issue when any gate fails on a push to
  # main, so a red main cannot go unnoticed (personal-cfo-md8h2.11). Not a
  # required check and not run on pull requests. The issue text is built only
  # from values GitHub computes (SHA, run URL, job results); nothing from a
  # commit message or a pull request title is interpolated into a shell.
  main-red-alert:
    name: Alert if main is red
    runs-on: ubuntu-24.04
    needs: [rust, frontend, ipc-codegen, security-scan, shell-scripts, desktop-nondesktop-check]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the ci-main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Only alert for the commit that is still the tip of main: a run of an older commit can
          # finish after a newer, green one has closed the alert, and must not reopen the story
          # (personal-cfo-md8h2.21). The tip's own run decides whether main is red.
          # If the tip has no run of its own (a `[skip ci]` commit) nothing else will decide, so
          # this run alerts after all.
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            tip_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$tip" --json databaseId --jq length)"
            if [ "${tip_runs:-0}" -gt 0 ]; then
              echo "main has moved on from ${SHA:0:12} (tip is ${tip:0:12}, which has its own run): this run does not alert."
              exit 0
            fi
          fi
          gh label create ci-main-red --repo "$GITHUB_REPOSITORY" --color b60205 \
            --description "A gate failed on a push to main" 2>/dev/null || true
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure") | "- " + .key')
          body=$(printf 'A gate failed on main at commit %s.\n\nFailed jobs:\n%s\n\nRun: %s\n\nFix forward or revert; this issue closes itself on the next green run of main.' "$SHA" "$failed" "$RUN_URL")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-main-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci-main-red \
              --title "main is red at ${SHA:0:12}" --body "$body"
          fi

  # Closes the ci-main-red issue when main is green again (personal-cfo-md8h2.21): the next push
  # run of main in which every gate above succeeded closes it with a comment linking the run.
  # A skipped or cancelled gate does not count as green (alert-close.sh checks every result),
  # and an issue labeled keep-open, or reopened by a person in the last 24 hours, is left open.
  # Not a required check.
  main-red-resolve:
    name: Close the main-red alert when main is green
    runs-on: ubuntu-24.04
    needs: [rust, frontend, ipc-codegen, security-scan, shell-scripts]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Close any open ci-main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/alert-close.sh --label ci-main-red --repo "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL" --what "main is green again (every gate passed on this push)" \
            --needs-json "$NEEDS" --only-if-tip "$GITHUB_SHA"

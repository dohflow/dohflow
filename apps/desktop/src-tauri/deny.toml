# cargo-deny configuration for the Tauri desktop crate (personal-cfo-o1nxk
# item 3). This crate is a STANDALONE Cargo workspace (see its own Cargo.toml
# header comment), deliberately detached from the repo-root workspace — so it
# needs its own deny.toml, checked separately from the root one.
#
# Scope: THIRD-PARTY dependency licenses only. This crate's own
# `license = "AGPL-3.0-only"` (ADR 0043; personal-cfo-fkt5.4) is unpublished
# (`publish = false`) — `[licenses.private]` below tells cargo-deny to skip
# it, auditing what we DEPEND ON instead.
#
# Run: `cargo deny check licenses` from apps/desktop/src-tauri.
# Companion file: ../../../deny.toml (the root workspace's own, separate
# dependency graph — Tauri/webview/native-bundling deps live only here).

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
# Identical allowlist to the root workspace's deny.toml — kept in sync by
# hand (two small files, changed rarely; a shared-include isn't worth the
# indirection). See that file's own comments for the full rationale on every
# entry, including CDLA-Permissive-2.0 (found during item 3's audit here too
# — this crate also depends on webpki-roots transitively via the updater
# plugin's HTTPS client).
allow = [
  "MIT",
  "Apache-2.0",
  # Apache-2.0 plus the LLVM exception (which REMOVES a restriction, allowing
  # static-linking without the exception's own additional notice obligations)
  # — strictly more permissive than bare Apache-2.0, already allowed above.
  # Found auditing this crate's GTK/webkit2gtk build-time dependency chain
  # (target-lexicon, via cfg-expr/system-deps). See
  # docs/security/release-review-v0.1.md item 3.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-2.0-or-later",
  "GPL-3.0-or-later",
  "AGPL-3.0",
  "AGPL-3.0-only",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

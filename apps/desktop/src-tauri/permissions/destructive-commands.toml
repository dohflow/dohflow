# Destructive / exfiltration-capable application commands (personal-cfo-3fdd.6,
# ADR 0010 addendum 2026-07-04). Kept OUT of allow-app-commands so the grant can be
# withheld from future isolated windows (personal-cfo-2no/vrng/z6pn) while the
# trusted main window keeps it via capabilities/destructive.json.
# See app-commands.toml for how this directory drives the app ACL and for the
# maintenance rule that every src/lib.rs command must appear in exactly one file.

[[permission]]
identifier = "allow-destructive-commands"
description = "Commands that can destroy or restore vault data (delete_vault, restore_backup, restore_backup_as_new_vault), move it out of the vault (export_backup, configure_backup, run_backup_now, export_transactions_csv, diagnostics_save), or swap/restart the binary (apply_update, relaunch_app). Granted only by capabilities/destructive.json (main window today)."
commands.allow = [
  "delete_vault",
  "export_backup",
  "configure_backup",
  "run_backup_now",
  "export_transactions_csv",
  # Writes the previewed redacted diagnostics bundle to a user-chosen file
  # (personal-cfo-lyd) — data leaving the vault, so never an untrusted window.
  "diagnostics_save",
  "restore_backup",
  "restore_backup_as_new_vault",
  "apply_update",
  "relaunch_app",
  # Hard-deletes a stored connector credential (personal-cfo-gglk).
  "connector_forget",
]

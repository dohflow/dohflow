# Application-command ACL (personal-cfo-3fdd.6, ADR 0010 addendum 2026-07-04).
#
# Any *.toml under src-tauri/permissions/ is picked up by the default
# `tauri_build::build()` (tauri-build 2.6.2 globs `permissions/**/*`) and becomes the
# app's ACL manifest. The moment that manifest exists, Tauri denies EVERY custom
# command that no capability grants to the calling window (tauri 2.11.2
# src/webview/mod.rs, the `has_app_acl_manifest` check) - deny-by-default for the
# whole surface, not just the commands named here.
#
# MAINTENANCE RULE: every command registered in `collect_commands![...]`
# (src/lib.rs) MUST appear in exactly one permission file in this directory:
#   - destructive-commands.toml -> destructive / exfiltration-capable commands
#   - this file                 -> everything else
# A command missing from both still compiles but is rejected at runtime with
# "Command <name> not allowed by ACL". `cargo check` verifies capability->permission
# references, NOT command-name spelling; keep names in sync with src/lib.rs.

[[permission]]
identifier = "allow-app-commands"
description = "Non-destructive Finance-Kernel command surface for the trusted main window. Destructive / exfiltration-capable commands live in destructive-commands.toml so future isolated windows (personal-cfo-2no/vrng/z6pn) can be granted this permission without them."
commands.allow = [
  "vault_status",
  "no_reset_warning",
  "acknowledge_no_reset_warning",
  "create_vault",
  "unlock_vault",
  "lock_vault",
  "change_password",

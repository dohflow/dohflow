[package]
name = "vault-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Vault cryptography for DohFlow: Argon2id key derivation (calibrated profiles) turning a vault password into a zeroizing Key Encryption Key. The pure, database-free crypto foundation of the secure-vault chain (personal-cfo-j0o)."

# vault-crypto is a PURE crypto crate: it must never depend on rusqlite, a DB, an
# async runtime, or the Tauri shell. The KDF takes salt + params as arguments;
# persisting them (vault_metadata) and the DEK envelope / unlock lifecycle live
# in db-worker / the vault module (personal-cfo-vhv). CI enforces the no-rusqlite
# and no-tokio/tauri boundary.
[dependencies]
argon2 = { workspace = true }
aes-gcm = { workspace = true }
# Named only so their zeroize features are enabled for the key schedule inside Aes256Gcm
# (personal-cfo-7ie.19); the code uses them through aes-gcm.
aes = { workspace = true }
ctr = { workspace = true }
ghash = { workspace = true }
# Attachment store (personal-cfo-bcj, ADR 0023): HKDF content-addressing subkey +
# HMAC-SHA256 keyed storage IDs. Pure RustCrypto — no DB/async.
sha2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }
# The envelope seal and the receiver-path opener (personal-cfo-g3m.22) implement sync-core's
# EnvelopeOpener. sync-core is pure format code and never depends on this crate.
sync-core = { path = "../sync-core" }
getrandom = { workspace = true }
thiserror = { workspace = true }
# Sync key custody (personal-cfo-1cltt.2): HPKE seals K_e and S to each enrolled device (C.6), and a
# device's Ed25519 key signs its membership and epoch records. See the pins in the workspace manifest.
hpke = { workspace = true }
# Named only so its zeroize feature is enabled for the copy hpke links (see the workspace manifest).
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
# Where a device keeps its Sync keys (personal-cfo-1cltt.2): the SecretStore trait and its value types.
# platform-traits has no platform code, no database and no runtime, so the boundary above holds.
platform-traits = { path = "../platform-traits" }

# Best-effort page-locking of secret buffers (personal-cfo-1t0). Unix-only;
# on other targets the lock is a documented no-op.
[dev-dependencies]
# The pipeline-level envelope vectors file (personal-cfo-g3m.25) is JSON.
serde_json = { workspace = true }
# The in-memory SecretStore for the custody tests.
platform-mock = { path = "../platform-mock" }
# The log-capture test: nothing in the key-custody path may put a key in a span or an event.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

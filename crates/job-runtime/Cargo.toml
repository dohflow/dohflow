[package]
name = "job-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Durable, local-only scheduled job lifecycle and cancellation primitives."

[dependencies]
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# The process-wide test subscriber log-capture tests install first (DoD §2.4,
# personal-cfo-56w.5). Dev-only: job-runtime has no observability dependency.
observability = { path = "../observability", features = ["test-support"] }

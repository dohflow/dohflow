# Raw write sites to replicated tables (personal-cfo-5ymg8.1).
#
# The module write lint (`tests/write_lint.rs`) scans non-test source under `crates/db-worker/src`
# (except `apply/`, `migrations.rs` and test modules) for INSERT / UPDATE / DELETE / REPLACE
# statements, and partitions them over write SITES: one entry per (module, table) with the number of
# statements. Only tables of class 1, 1b or 4 in `table_classes.toml` count; class 2 (derived) and
# class 3 (device-local) tables may be written anywhere.
#
# Every site must be listed here, with the count of statements, and the lint fails on a new one, on
# a stale one and on a changed count: a new raw write to a replicated table has to be routed
# through the command bus or justified in this file in the same change.
#
# `status`:
#   pending       a violation awaiting the child bead named in `bead` (the warn-mode checklist; the
#                 lint prints it). `personal-cfo-5ymg8.8` flips the lint to fail while any remains.
#   bus_internal  not a violation: a helper reached only from `apply/` (the command bus), so its
#                 writes are inside the command's transaction and write set.
#   allowed       not a violation, with the reason in `note`.


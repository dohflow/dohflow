[[site]]
module = "sync_materialize.rs"
table = "parser_runs"
class = "1b"
statements = 3
status = "allowed"
bead = "personal-cfo-0g528"
note = "receiver materialization (C.9): the rows of a source batch fetched from the service, written outside any command and before the envelope that references them applies; the batch is immutable by its artifact ids, so every column is a pure function of the artifact and a replay is idempotent (an equal row is left, a differing row is refused). Reached from the receiver path after stage 9(b) has accepted the batch, and from the replica bootstrap (personal-cfo-1cltt.7), which materializes a batch once its parts are complete and its split canonical; the closure-wide check follows, and a failure of it discards the whole build, which is not yet a vault. The DELETE statements remove the rows of a batch that is not in the live closure at the preceding position, which are a cache that materialization replaces (C.9), and are refused when a replicated provenance link names one of the records."


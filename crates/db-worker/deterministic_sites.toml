# Deterministic rejection sites (personal-cfo-g3m.26; vault-format.md C.10 "Apply failures").
#
# A command is a deterministic apply failure (it stops a Sync replica and a void can name it) only
# when it is rejected by a validator AUDITED as reading nothing but the command's payload and
# metadata and the class-1 base state. Such a validator raises `DbError::Rejected` through
# `DbError::reject(...)`; any other error, including `DbError::InvalidCommand`, is NOT a verdict.
#
# This manifest is the audit's ledger: one entry per module with the number of `DbError::reject(`
# calls. `tests/deterministic_sites.rs` fails on a module that is not listed, a stale entry and a
# changed count, so a new deterministic site has to be listed (and reviewed) in the same change.
# `tests/apply_rejections.rs` proves the listed behavior: each rejection gives the same code and
# the same write set under two device time zones and two class-3 states.
#
# `bead` names the change that audited the module.

[[site]]
module = "apply/accounts.rs"
statements = 8
bead = "personal-cfo-g3m.26"
note = "Payload-domain and class-1 reference checks of the account commands."

[[site]]
module = "apply/assumption_cmds.rs"
statements = 7
bead = "personal-cfo-5ymg8.4"
note = "Assumption events: the parameters are a JSON object, the scenario (class 1) exists, the caller-minted id is unused in the base, an event cannot supersede itself, a replacement keeps the scope of the event it supersedes, and the event being superseded or cleared exists and is still active in the base."

[[site]]
module = "apply/balance_cmds.rs"
statements = 4
bead = "personal-cfo-5ymg8.3"
note = "The balance commands: the account (class 1) exists and holds the amount's currency, the caller-minted assertion id is unused in the base, and a reading is not dated after the command's household-local day (the household time zone is class 1, the instant is metadata)."

[[site]]
module = "apply/categorization_cmds.rs"
statements = 10
bead = "personal-cfo-g3m.26"
note = "Payload-domain and class-1 reference checks of the category and recategorization commands."

[[site]]
module = "apply/mod.rs"
statements = 1
bead = "personal-cfo-g3m.26"
note = "require_issued_at: a pure function of the command's metadata, sharing the C.4 receiver bound (1970-01-01 to 9999-12-31)."

[[table]]
table = "command_idempotency_keys"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local idempotency memo; it is replay-owned only for an active local plan and is never copied from a stale base."
rebase_phase = "replay_owned"
rebase_preservation = "stable rows overlay by immutable key; a planned row is absent until its command auto-replays or receives a queued disposition"
reference_validation = "command_id, idempotency tag, immutable metadata commitment, and referenced class-1 result must match before remap"
correlate_to_live_plan = "immutable command_id, idempotency_key_tag, envelope digest, and complete original metadata"
auto_replay_remap = "rebuild the memo against the new op_seq after the canonical mutation succeeds"
queued_disposition = "remove the dispatchable memo and retain the evidence as QueuedForDisposition"

[[table]]
table = "vault_meta"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local node identity; not part of a snapshot or Sync tail."
rebase_phase = "stable"
rebase_preservation = "preserve the current node identity in the scratch vault"
reference_validation = "node identity must remain well-formed before swap"

[[table]]
table = "vault_metadata"
class = "3"
owner_bead = "personal-cfo-vhv"
note = "Vault-local envelope and KDF parameters; class-1 snapshots never carry origin key material."
rebase_phase = "stable"
rebase_preservation = "preserve the current vault envelope, KDF parameters, and local manifest pointer"
reference_validation = "schema and envelope versions must be supported before swap"

[[table]]
table = "schema_migrations"
class = "3"
owner_bead = "personal-cfo-wkn"
note = "Device-local migration tracker; migrations are applied by the receiving build, not by Sync."
rebase_phase = "stable"
rebase_preservation = "retain the scratch vault migration history only after its schema hash validates"
reference_validation = "every applied version must match this build's migration content hash"

[[table]]
table = "audit_events"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local audit evidence with runtime-stable security rows and runtime-replay-owned planned-command rows; SYNC-1c selects the branch by event type and fails closed on an invalid reference."
rebase_phase = "mixed"
rebase_preservation = "select the stable or replay-owned preservation branch by event type; never swap after a failed branch validation"
reference_validation = "select the stable or replay-owned reference rule by event type and enter RebaseBlockedLocalState on failure"
stable_selector = "event_type is a security or capability acknowledgement with no dispatchable local plan"
stable_rebase_preservation = "overlay the immutable local evidence after class-1 envelopes are applied"
stable_reference_validation = "event metadata remains local diagnostic evidence and its command/correlation ids stay well-formed"
replay_owned_selector = "event_type identifies a planned-command audit row tied to an outbox or immutable rebase plan"
replay_owned_rebase_preservation = "retain evidence while the plan is live; reconcile it only after replay or queued disposition"
replay_owned_reference_validation = "command id, idempotency tag, immutable metadata commitment, and referenced class-1 result must match before remap"
replay_owned_correlate_to_live_plan = "correlate command id, idempotency_key_tag, envelope digest, and complete original metadata to the immutable plan"
replay_owned_auto_replay_remap = "rebuild the audit evidence against the new op_seq after the canonical mutation succeeds"
replay_owned_queued_disposition = "remove dispatchable replay evidence and retain the original row as QueuedForDisposition"

[[table]]
table = "settings"
class = "3"
owner_bead = "personal-cfo-5ymg8"
note = "Current direct-write table is class 3 for device.* keys; the six existing unprefixed keys are explicit legacy user preferences pending the backwards-compatible prefix migration/dual-read rollout owned by personal-cfo-5ymg8; ADR 0074 / SYNC-2 decide routing without a rename in this bead."
rebase_phase = "stable"
rebase_preservation = "preserve device.* values from the live vault and retain legacy user values until their prefixed dual-read migration completes"
reference_validation = "key scope is validated by the device.* / user.* convention; legacy keys remain readable and are not treated as device-local"
legacy_settings_keys = "locale,reporting_currency"
legacy_persisted_keys = "locale,reporting_currency,minimum_cash_floor_minor,comfort_band_upper_minor,auto_categorize_on_import,future_cash_series_selection"
legacy_key_scope = "locale=user,reporting_currency=user,minimum_cash_floor_minor=user,comfort_band_upper_minor=user,auto_categorize_on_import=user,future_cash_series_selection=user"
prefix_migration_bead = "personal-cfo-5ymg8"
new_setting_keys = ""


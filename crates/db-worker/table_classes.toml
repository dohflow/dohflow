note = "Detector read model keyed by canonical merchant and cadence evidence; verify classification before Sync implementation."

[[table]]
table = "command_idempotency_keys"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local idempotency memo; it is replay-owned only for an active local plan and is never copied from a stale base."
rebase_phase = "replay_owned"
rebase_preservation = "stable rows overlay by immutable key; a planned row is absent until its command auto-replays or receives a queued disposition"
reference_validation = "command_id, idempotency tag, immutable metadata commitment, and referenced class-1 result must match before remap"
correlate_to_live_plan = "immutable command_id, idempotency_key_tag, envelope digest, and complete original metadata"
auto_replay_remap = "rebuild the memo against the new op_seq after the canonical mutation succeeds"
queued_disposition = "remove the dispatchable memo and retain the evidence as QueuedForDisposition"

[[table]]
table = "sync_base"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local singleton: whether Sync is enabled on this device (a row exists), the server seq of the base image, the digest of sync/base.db, and the base state (NoBase, Ready or Rebasing). A restored vault whose digest does not match the file on disk has no base."
rebase_phase = "stable"
rebase_preservation = "the live row survives the swap untouched except where the swap itself advances base_seq, base_digest and state after the new base image is captured"
reference_validation = "state is NoBase exactly when base_digest is null; a Ready or Rebasing row's digest must match sync/base.db before any rebase"

[[table]]
table = "sync_outbox"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local outbox: one row per unpushed local command, keyed by command_id and written in the same transaction as its operation-log row while Sync is enabled. Holds the command's write-set row keys, its state (Pending, Approved or Bound), the sealed container once Approved, and the bound seq and result reference. Operation_log stays append-only; outbox state lives only here."
rebase_phase = "replay_owned"
rebase_preservation = "an entry is rebuilt by the rebase: it is replayed under its original command_id when its write set is untouched and it still validates, otherwise its group moves to outbox_queue; no entry is dropped and none is applied twice"
reference_validation = "op_seq must name an operation_log row with the same command_id; write_set_keys must decode; a Bound entry's seq and result reference must match the accepted evidence"
correlate_to_live_plan = "immutable command_id, with the original operation_log row's idempotency_key, correlation_id and causation_id"
auto_replay_remap = "after the canonical mutation succeeds on the new base, rewrite op_seq to the rebuilt row, replace write_set_keys with the replayed command's, and reseal; the entry keeps its command_id"
queued_disposition = "remove the entry from the dispatchable outbox and keep its envelope and audit evidence as an outbox_queue record"

[[table]]
table = "outbox_queue"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local queue of commands a rebase set aside for the user, one record per command, grouped by correlation_id. Keeps the ADR 0073 reason (queue_choose or queue_edit), the original envelope, the audit evidence, the origin node and when it was queued. A group stays until the user resolves it with a new command or re-bootstraps; nothing expires."
rebase_phase = "stable"
rebase_preservation = "preserve every record byte for byte across the swap; a rebase only adds records, and a record is removed only by the user's resolution"
reference_validation = "command_id, correlation_id and origin node id are well-formed; the envelope and audit evidence are present"

[[table]]
table = "vault_meta"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local node identity; not part of a snapshot or Sync tail."
rebase_phase = "stable"
rebase_preservation = "preserve the current node identity in the scratch vault"
reference_validation = "node identity must remain well-formed before swap"

[[table]]
table = "vault_metadata"
class = "3"
owner_bead = "personal-cfo-vhv"
note = "Vault-local envelope and KDF parameters; class-1 snapshots never carry origin key material."
rebase_phase = "stable"
rebase_preservation = "preserve the current vault envelope, KDF parameters, and local manifest pointer"
reference_validation = "schema and envelope versions must be supported before swap"

[[table]]
table = "schema_migrations"
class = "3"
owner_bead = "personal-cfo-wkn"
note = "Device-local migration tracker; migrations are applied by the receiving build, not by Sync."
rebase_phase = "stable"
rebase_preservation = "retain the scratch vault migration history only after its schema hash validates"
reference_validation = "every applied version must match this build's migration content hash"

[[table]]
table = "audit_events"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local audit evidence with runtime-stable security rows and runtime-replay-owned planned-command rows; SYNC-1c selects the branch by event type and fails closed on an invalid reference."
rebase_phase = "mixed"
rebase_preservation = "select the stable or replay-owned preservation branch by event type; never swap after a failed branch validation"
reference_validation = "select the stable or replay-owned reference rule by event type and enter RebaseBlockedLocalState on failure"
stable_selector = "event_type is a security or capability acknowledgement with no dispatchable local plan"
stable_rebase_preservation = "overlay the immutable local evidence after class-1 envelopes are applied"
stable_reference_validation = "event metadata remains local diagnostic evidence and its command/correlation ids stay well-formed"
replay_owned_selector = "event_type identifies a planned-command audit row tied to an outbox or immutable rebase plan"
replay_owned_rebase_preservation = "retain evidence while the plan is live; reconcile it only after replay or queued disposition"
replay_owned_reference_validation = "command id, idempotency tag, immutable metadata commitment, and referenced class-1 result must match before remap"
replay_owned_correlate_to_live_plan = "correlate command id, idempotency_key_tag, envelope digest, and complete original metadata to the immutable plan"
replay_owned_auto_replay_remap = "rebuild the audit evidence against the new op_seq after the canonical mutation succeeds"
replay_owned_queued_disposition = "remove dispatchable replay evidence and retain the original row as QueuedForDisposition"

[[table]]
table = "settings"
class = "3"
owner_bead = "personal-cfo-5ymg8.7"
note = "device.* keys are class 3, node-local, written by DbWorker::set_device_setting. The five user.* keys are the household's preferences (class 1, ADR 0074 Decision 5): they follow the person and are written only by SetUserSetting. The row is one table with two scopes, so its class stays 3 and the write set is a projection onto the user.* rows."
rebase_phase = "stable"
rebase_preservation = "preserve device.* values from the live vault; user.* rows are replicated state"
reference_validation = "key scope is the device.* / user.* convention; a user.* key outside the registry is refused by SetUserSetting"
user_setting_keys = "user.reporting_currency,user.minimum_cash_floor_minor,user.comfort_band_upper_minor,user.auto_categorize_on_import,user.future_cash_series_selection"
new_setting_keys = ""

[[table]]
table = "connector_connections"
class = "1"
owner_bead = "personal-cfo-07u"
note = "Connection identity (id, adapter, display hint, created/updated, deleted_at tombstone); no credential, watermark or error. The credential and refresh state live in the class-3 connector_connection_secrets. Deleting a connection is a tombstone (the fourth, after SYNC-2b's three), never a hard delete. Writes are raw until personal-cfo-5ymg8 routes them through the command bus, so 'replicated' is the classification and schema only until then."

[[table]]
table = "connector_connection_secrets"
class = "3"
owner_bead = "personal-cfo-07u"
note = "Device-local provider credential, last refresh time and last error for one connection; never replicated, exported or snapshotted. A connection whose identity exists but has no row here shows 'enter your token on this device' and never refreshes."
secret_bearing = "true"
rebase_phase = "stable"
rebase_preservation = "preserve credential, last_synced_at, last_error and updated_at byte for byte across the swap; never overlay a remote value; never read by apply"
reference_validation = "connection_id must name a connector_connections row in the rebuilt class-1 state (a tombstoned one counts as present); an absent identity enters RebaseBlockedLocalState with no swap"

[[table]]
table = "connector_link_cursors"
class = "3"
owner_bead = "personal-cfo-07u"
note = "Device-local per-account refresh watermark (last_synced_on). external_id is data, not a foreign key to the links: a mapping a remote command removed leaves a harmless cursor that refresh ignores and local cleanup removes."
rebase_phase = "stable"
rebase_preservation = "preserve each cursor byte for byte across the swap; never overlay a remote value"
reference_validation = "connection_id must name a connector_connections row in the rebuilt class-1 state (a tombstoned one counts as present); an absent identity enters RebaseBlockedLocalState with no swap; external_id is not validated against the links"

[[table]]
table = "connector_attention"
class = "3"
owner_bead = "personal-cfo-pxi.22"
note = "Device-local re-authentication notices (which bank needs a sign-in at the provider); written by this device's refresh and cleared by its next healthy one. Never replicated; holds provider-supplied bank names inside the encrypted vault."
rebase_phase = "stable"
rebase_preservation = "preserve the local notice on a scratch rebase; the next healthy refresh clears it"
reference_validation = "connection_id must resolve to a local connector_connections row; a stale one is dropped, never blocks the swap"

[[table]]
table = "connector_account_links"
class = "1"
owner_bead = "personal-cfo-07u"
note = "External-account to ledger-account mapping and currency, per connection. The per-account refresh watermark is device-local and lives in connector_link_cursors. The adapter's account-key function is part of the identity (ADR 0074 Addendum B): external_id is copied as is and never re-derived. Writes are raw until personal-cfo-5ymg8 routes them through the command bus."

[[table]]
table = "staged_accounts"
class = "3"
owner_bead = "personal-cfo-m8f2"
note = "Device-local import staging; staged rows never enter a snapshot or Sync tail."
rebase_phase = "stable"
rebase_preservation = "preserve staged candidates from the live device"
reference_validation = "source batch and proposed account references must remain local and valid"

[[table]]
table = "staged_balances"
class = "3"
owner_bead = "personal-cfo-m8f2"
note = "Device-local import staging; balance candidates remain on the device until committed."
rebase_phase = "stable"
rebase_preservation = "preserve staged candidates and their source references"
reference_validation = "staged account and source record references must resolve before swap"

[[table]]
table = "staged_transactions"
class = "3"
owner_bead = "personal-cfo-m8f2"
note = "Device-local import staging; only the committed class-1 transaction crosses the Sync boundary."
rebase_phase = "stable"
rebase_preservation = "preserve pending staged candidates and commit-plan evidence"
reference_validation = "source records and proposed account references must resolve before swap"

[[table]]
table = "system_ledger_accounts"
class = "1"
owner_bead = "personal-cfo-32fmp.3"
note = "The (role, currency) to ledger account map that apply reads to choose, and to create, the class-1 system ledger accounts (equity, unmatched income and the like), so it is consensus state and replicates with them; a legacy vault keeps its random ids, a new pair gets a content-derived id. Corrected from class 3 by ADR 0074 Addendum G (it was bxsbz's device-local classification)."

[[table]]
table = "projection_cursors"
class = "3"
owner_bead = "personal-cfo-bxsbz"
note = "Device-local projection progress; read models are rebuilt rather than shipped."
rebase_phase = "stable"
rebase_preservation = "preserve cursor evidence only when the corresponding derived checksum is valid"
reference_validation = "cursor names and op sequence references must be valid for the local schema"

[[table]]
table = "dedupe_decisions"
class = "4"
owner_bead = "personal-cfo-5ymg8"
note = "A committed decision is written by CommitImportedTransaction (no staged id, content-derived id); a flagged or skipped decision names a device-local staging row and is still written outside the bus by the staged-import worker methods, so this stays a class-4 candidate until personal-cfo-5ymg8.6 makes the decision a command; ADR 0074 and SYNC-2 decide routing so a dedupe choice follows the related history."

[[table]]
table = "balance_observations"
class = "1"
owner_bead = "personal-cfo-5ymg8"
note = "An account's balance as of a day, manual or reported by a connector. Written only by RecordBalanceAssertion (appended, never last-wins) and RecordConnectorBalance (an upsert on account, day and connector, monotone in issued_at, with a content-derived id). Rows are updated in place and never hard-deleted. source_record_id is NULL by design on every command-written row, with no foreign key, because a staged source record is device-local; legacy rows keep their values."

[[table]]
table = "scenarios"
class = "1"
owner_bead = "personal-cfo-5ymg8.4"
note = "A named scenario (definition and lifecycle). Written only by CreateScenario, SetScenarioStatus, RenameScenario, SetScenarioExpiry, CloneScenario, DeleteScenario, ReinstateScenario, ApplyScenario and RevertScenarioApply. A delete is a tombstone (deleted_at = issued_at) that leaves the scenario's events in place; base_run_id is NULL on every command-written row because a forecast run is class 2 and never shipped (ADR 0074 Addendum H)."

[[table]]
table = "forecast_assumption_events"
class = "1"
owner_bead = "personal-cfo-5ymg8.4"
note = "An assumption event (a base override or a scenario overlay row). Written only by RecordAssumptionEvent, SupersedeAssumptionEvent, ClearAssumptionEvent, CloneScenario, ApplyScenario and RevertScenarioApply; content is immutable once written (a supersede inserts a new row), only status and superseded_by change. origin_run_id is NULL on every command-written row because a forecast run is class 2 (ADR 0074 Addendum H)."

[[table]]
table = "forecast_dependency_edges"
class = "2"
owner_bead = "personal-cfo-5ymg8.4"
note = "Per-run attribution (an assumption event to a forecast row of one run). Derived from class-2 forecast_runs and forecast_rows, rebuilt locally and never shipped; no production caller writes it. Corrected from class 4 by ADR 0074 Addendum F."

[[table]]
table = "merchant_aliases"
class = "1"
owner_bead = "personal-cfo-5ymg8.5"
note = "Merchant alias mappings; the genesis seed and MintMerchantAnchors write them, and a user correction follows the user (ADR 0074 Decision 5). Routed from class 4 by personal-cfo-5ymg8.5."

[[table]]
table = "merchant_identities"
class = "1"
owner_bead = "personal-cfo-5ymg8.5"
note = "Merchant identities; the genesis seed and MintMerchantAnchors write them (ADR 0074 Decision 5). Routed from class 4 by personal-cfo-5ymg8.5."

[[table]]
table = "manual_entry_links"
class = "4"
owner_bead = "personal-cfo-5ymg8"
note = "Current manual-entry link writer is direct; ADR 0074 and SYNC-2 decide class-1 routing so the link remains explainable on every device."

[[table]]
table = "transaction_categorizations"
class = "1"
owner_bead = "personal-cfo-5ymg8.5"
note = "Transaction categorizations; RecategorizeTransaction, the import commit and ApplyMerchantMemory write them, all through the command bus (ADR 0074 Decision 5). Routed from class 4 by personal-cfo-5ymg8.5."

[[table]]
table = "settings_user_keys"
kind = "pseudo"
class = "1"
owner_bead = "personal-cfo-5ymg8.7"
note = "Key-scope marker only: the user.* keys of settings are class 1 and are written by SetUserSetting (ADR 0074 Decision 5)."

[[table]]
table = "attachment_blobs"
kind = "pseudo"
class = "1b"
owner_bead = "personal-cfo-bcj"
note = "ADR 0023 encrypted blob store pseudo-row; bytes close over an opaque artifact reference and are materialized locally under the receiver DEK."
local_identity = "local blob UUID and receiver-local materialization identity"
opaque_sync_reference = "opaque sync_artifact_id_e"
closure_role = "snapshot-full"
retention = "retain ciphertext while a canonical attachment row or retained recovery root references it"
reference_validation = "verify SyncArtifactTransportV1 integrity and receiver-DEK materialization; fail with ArtifactMaterializationFailed"

[[table]]
table = "durable_jobs"
class = "3"
owner_bead = "personal-cfo-ati"
note = "Device-local scheduled work, retry state, unlock-window claims, and opaque encrypted-vault job configuration; never included in a Sync snapshot or tail."
rebase_phase = "stable"
rebase_preservation = "preserve queued/running/terminal state and in-flight unlock-window evidence on a scratch rebase"
reference_validation = "job kind, schedule, retry policy, and opaque payload remain locally valid before swap"

[[table]]
table = "backup_history"
class = "3"
owner_bead = "personal-cfo-8qh"
note = "Device-local receipts for manual and scheduled verified backups; destination paths stay inside the vault and never enter Sync or telemetry."
rebase_phase = "stable"
rebase_preservation = "preserve local backup receipts on a scratch rebase"
reference_validation = "vault ids and destination paths remain local; scheduled backups never delete destination files"

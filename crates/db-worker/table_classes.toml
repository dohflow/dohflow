receiver_local_fields = ""

[[table]]
table = "source_batches"
class = "1b"
owner_bead = "personal-cfo-m8f2"
note = "Import provenance artifact envelope; the batch identity is opaque to the service and the bytes close over retained recovery roots."
local_identity = "source_batch UUID plus local vault row identity"
opaque_sync_reference = "opaque sync_artifact_id_e"
closure_role = "envelope-delta"
retention = "retain while a committed ledger row or recovery root references the artifact"
reference_validation = "source records and committed rows must resolve before apply or rebase"

[[table]]
table = "source_records"
class = "1b"
owner_bead = "personal-cfo-m8f2"
note = "User-supplied import record artifact; the service receives only an opaque artifact reference."
local_identity = "source_record UUID plus local vault row identity"
opaque_sync_reference = "opaque sync_artifact_id_e"
closure_role = "envelope-delta"
retention = "retain for the provenance closure of its committed ledger row"
reference_validation = "the source batch and entity provenance link must resolve before apply or rebase"

[[table]]
table = "parser_runs"
class = "1b"
owner_bead = "personal-cfo-m8f2"
note = "Parser evidence artifact; parser output is portable only through an opaque Sync artifact envelope."
local_identity = "parser_run UUID plus local vault row identity"
opaque_sync_reference = "opaque sync_artifact_id_e"
closure_role = "snapshot-full"
retention = "retain while the associated source batch remains recoverable"
reference_validation = "the parser run must resolve to a retained source batch before replay"

[[table]]
table = "source_provenance_links"
class = "1b"
owner_bead = "personal-cfo-m8f2"
note = "Provenance invariant for imported artifacts; m8f2 owns the entity-to-source closure."
local_identity = "entity UUID and source_record UUID in the local vault"
opaque_sync_reference = "opaque sync_artifact_id_e"
closure_role = "envelope-delta"
retention = "retain until every linked class-1 row is tombstoned and its recovery root advances"
reference_validation = "entity and source artifact closure is checked before a replay or snapshot swap"

